<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REL301m Ôn Trắc Nghiệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky toolbar on top, question-number grid on the left, one question card in the middle. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eef2f8; --fg:#16202f; --muted:#586478; --line:#d8dfea;
  --accent:#1d4f91; --accent-fg:#ffffff; --accent-soft:#e3ecf9;
  --ok:#17724a; --ok-bg:#e2f4ea; --bad:#b3261e; --bad-bg:#fbe6e4; --warn:#8a5a00; --warn-bg:#fff3d6;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --surface:#161e2c; --surface2:#1d2738; --fg:#e5eaf3; --muted:#97a3b6; --line:#2a3650;
    --accent:#8bb8ff; --accent-fg:#0b1220; --accent-soft:#1b2a45;
    --ok:#62d29a; --ok-bg:#12301f; --bad:#ff8c82; --bad-bg:#3b1815; --warn:#f2c35b; --warn-bg:#35290a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#161e2c; --surface2:#1d2738; --fg:#e5eaf3; --muted:#97a3b6; --line:#2a3650;
  --accent:#8bb8ff; --accent-fg:#0b1220; --accent-soft:#1b2a45;
  --ok:#62d29a; --ok-bg:#12301f; --bad:#ff8c82; --bad-bg:#3b1815; --warn:#f2c35b; --warn-bg:#35290a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;margin:0}
button,select,input{font:inherit;color:inherit}
.app{min-height:100%;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto;min-width:0}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.btn,.seg button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:38px}
select{max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);gap:24px;padding-top:20px;align-items:start}
.side{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:calc(100vh - 100px);overflow:auto}
.stats{font-size:13px;color:var(--muted);margin-bottom:10px;display:grid;gap:4px}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.grid button{border:1px solid var(--line);background:var(--surface2);border-radius:7px;min-height:36px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;padding:0}
.grid button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.grid button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--surface2);border:1px solid var(--line)}
.legend .l-ok::before{background:var(--ok-bg);border-color:var(--ok)}.legend .l-bad::before{background:var(--bad-bg);border-color:var(--bad)}
.side .btn{margin-top:12px;width:100%;font-size:13px}
.main{min-width:0;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.tag{border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:12px;background:var(--surface2)}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.q-en{font-size:19px;font-weight:600;line-height:1.5;margin:0 0 6px;text-wrap:pretty;overflow-wrap:anywhere}
.q-vi{margin:0 0 18px;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;align-items:start}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .let{width:30px;height:30px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt .en{font-weight:500;overflow-wrap:anywhere}
.opt .vi{display:block;color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.opt .note{display:block;font-size:13px;margin-top:6px;color:var(--fg);opacity:.85}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{background:var(--accent);color:var(--accent-fg)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .let{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .let{background:var(--bad);color:var(--surface)}
.opt.miss{border-style:dashed}
.opt[disabled]{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.verdict{margin-top:18px;border-radius:10px;padding:12px 16px;font-weight:600}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict small{display:block;font-weight:400;color:var(--fg);margin-top:4px;font-size:14px}
.sec{margin-top:20px}
.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec p{margin:0 0 8px;overflow-wrap:anywhere}
.sec ul{margin:0 0 8px;padding-left:20px}
.math{overflow-x:auto;padding:6px 0;margin:4px 0 10px;max-width:100%}
pre.math{font-family:var(--mono);font-size:13px;background:var(--surface2);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.tipbox{background:var(--accent-soft);border-radius:10px;padding:10px 14px}
.pager{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pager .mid{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pager input{width:76px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-height:38px;text-align:center}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.only-mobile{display:none}
.kbd{font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;display:none}
  .side.open{display:block}
  .only-mobile{display:inline-flex}
  .top{position:static}
  .card{padding:16px}
  .q-en{font-size:17px}
}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:border-color .12s,background .12s}}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>


</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">REL301m · Ôn trắc nghiệm<small id="sub">359 câu, có giải thích tiếng Việt</small></div>
    <div class="ctl">
      <select id="setSel" aria-label="Chọn bộ câu hỏi"></select>
      <div class="seg" role="group" aria-label="Chế độ">
        <button id="mStudy" aria-pressed="true">Ôn từng câu</button>
        <button id="mWrong" aria-pressed="false">Ôn câu làm sai</button>
      </div>
      <button class="btn" id="trBtn" aria-pressed="true" title="Bật/tắt bản dịch tiếng Việt của câu hỏi và lựa chọn">Dịch: bật</button>
      <button class="btn" id="themeBtn" title="Đổi giao diện sáng/tối">Giao diện</button>
      <button class="btn only-mobile" id="listBtn">Danh sách câu</button>
    </div>
  </header>
  <div class="layout">
    <aside class="side" id="side" aria-label="Danh sách câu hỏi">
      <div class="stats" id="stats"></div>
      <div class="bar" id="bar"></div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span class="l-ok">Đúng</span><span class="l-bad">Sai</span><span>Chưa làm</span></div>
      <button class="btn" id="resetBtn">Xóa tiến độ của bộ này</button>
    </aside>
    <main class="main">
      <article class="card" id="card"></article>
      <nav class="pager" aria-label="Điều hướng câu hỏi">
        <button class="btn" id="prev">← Câu trước</button>
        <div class="mid">
          <label for="jump" class="kbd">Đến câu</label>
          <input id="jump" type="number" min="1" inputmode="numeric">
          <button class="btn" id="goBtn">Đi</button>
          <button class="btn" id="rndBtn" title="Chọn một câu chưa làm">Câu chưa làm</button>
        </div>
        <button class="btn primary" id="next">Câu sau →</button>
      </nav>
      <p class="kbd">Phím tắt: ← → chuyển câu, A–F chọn đáp án, Enter kiểm tra / sang câu sau.</p>
    </main>
  </div>
</div>
<script src="data.js"></script>
<script>
(function(){
var Q=window.QDATA||[];
var KEY='rel301m-quiz-v1';
var SETS=[
 {id:'all',label:'Tất cả (359 câu)',f:function(q){return true}},
 {id:'e1',label:'Đề SU26 FE (câu 1–50)',f:function(q){return q.part==='exam'&&q.n<=50}},
 {id:'e2',label:'Đề SU25 RE (câu 51–100)',f:function(q){return q.part==='exam'&&q.n>50&&q.n<=100}},
 {id:'e3',label:'Đề SP26 FE (câu 101–150)',f:function(q){return q.part==='exam'&&q.n>100&&q.n<=150}},
 {id:'e4',label:'Đề RE (câu 151–200)',f:function(q){return q.part==='exam'&&q.n>150}},
 {id:'c1',label:'Coursera C1 (51 câu)',f:function(q){return q.part==='c1'}},
 {id:'c2',label:'Coursera C2 (40 câu)',f:function(q){return q.part==='c2'}},
 {id:'c3',label:'Coursera C3 (48 câu)',f:function(q){return q.part==='c3'}},
 {id:'c4',label:'Coursera C4 (20 câu)',f:function(q){return q.part==='c4'}}
];
var PART_LABEL={exam:'Đề thi',c1:'Coursera C1',c2:'Coursera C2',c3:'Coursera C3',c4:'Coursera C4'};
var store={ans:{},ok:{},set:'e1',idx:0,mode:'study',tr:true,theme:''};
try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)for(var k in s)store[k]=s[k]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var list=[],sel={},rootEl=document.documentElement;
function applyTheme(){if(store.theme)rootEl.setAttribute('data-theme',store.theme);else rootEl.removeAttribute('data-theme')}
function setDef(){return SETS.filter(function(s){return s.id===store.set})[0]||SETS[0]}
function buildList(){
  var d=setDef();var base=Q.filter(d.f);
  if(store.mode==='wrong')base=base.filter(function(q){return store.ok[q.id]===false});
  list=base;
  if(store.idx>=list.length)store.idx=Math.max(0,list.length-1);
  if(store.idx<0)store.idx=0;
}
function isMulti(q){return q.ans.length>1||/select all|choose all/i.test(q.en)}
function cur(){return list[store.idx]}
function mathHtml(src){
  if(window.katex){
    try{
      var s=src.indexOf('\\\\')>=0?'\\begin{gathered}'+src+'\\end{gathered}':src;
      return '<div class="math">'+window.katex.renderToString(s,{displayMode:true,throwOnError:false,strict:false})+'</div>';
    }catch(e){}
  }
  return '<pre class="math">'+esc(src)+'</pre>';
}
function blocksHtml(bs){
  var h='';
  (bs||[]).forEach(function(b){
    if(b[0]==='p')h+='<p>'+esc(b[1])+'</p>';
    else if(b[0]==='list')h+='<ul>'+b[1].map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
    else if(b[0]==='code')h+=mathHtml(b[1]);
  });
  return h;
}
function secHtml(title,bs,cls){
  if(!bs||!bs.length)return '';
  return '<section class="sec"><h3>'+title+'</h3>'+(cls?'<div class="'+cls+'">':'')+blocksHtml(bs)+(cls?'</div>':'')+'</section>';
}
function renderStats(){
  var d=setDef(),all=Q.filter(d.f),done=0,right=0;
  all.forEach(function(q){if(q.id in store.ok){done++;if(store.ok[q.id])right++}});
  var pct=done?Math.round(100*right/done):0;
  $('stats').innerHTML='<div>Đã làm <b>'+done+'/'+all.length+'</b></div><div>Đúng <b>'+right+'</b>'+(done?' ('+pct+'%)':'')+' · Sai <b>'+(done-right)+'</b></div>';
  $('bar').innerHTML='<i class="g" style="width:'+(all.length?100*right/all.length:0)+'%"></i><i class="r" style="width:'+(all.length?100*(done-right)/all.length:0)+'%"></i>';
}
function renderGrid(){
  $('grid').innerHTML=list.map(function(q,i){
    var c=(q.id in store.ok)?(store.ok[q.id]?'ok':'bad'):'';
    if(i===store.idx)c+=' cur';
    return '<button data-i="'+i+'" class="'+c+'" title="'+esc(PART_LABEL[q.part]+' · câu '+q.n)+'" aria-label="Câu '+(i+1)+'">'+(i+1)+'</button>';
  }).join('');
}
function renderCard(){
  var q=cur(),c=$('card');
  if(!q){
    c.innerHTML='<div class="empty"><p><b>'+(store.mode==='wrong'?'Chưa có câu làm sai trong bộ này.':'Bộ này chưa có câu hỏi.')+'</b></p><p>'+(store.mode==='wrong'?'Hãy làm vài câu ở chế độ “Ôn từng câu”. Những câu bạn trả lời sai sẽ được gom về đây.':'')+'</p></div>';
    $('jump').value='';return;
  }
  var answered=q.id in store.ans,chosen=answered?store.ans[q.id].split(''):Object.keys(sel).filter(function(k){return sel[k]});
  var multi=isMulti(q),correct=q.ans.split('');
  var h='<div class="meta"><span class="tag">'+PART_LABEL[q.part]+' · câu '+q.n+'</span><span>'+(store.idx+1)+' / '+list.length+'</span>'+(q.fig?'<span class="tag warn">Câu có hình, xem đề gốc</span>':'')+'</div>';
  h+='<p class="q-en">'+esc(q.en)+'</p>';
  if(store.tr)h+='<p class="q-vi">'+esc(q.vi)+'</p>';else h+='<div style="height:12px"></div>';
  h+='<p class="hint">'+(multi?'Chọn tất cả đáp án đúng, rồi bấm “Kiểm tra”.':'Chọn một đáp án.')+'</p><ul class="opts">';
  q.opts.forEach(function(o){
    var cl='opt',on=chosen.indexOf(o.l)>=0,isC=correct.indexOf(o.l)>=0;
    if(answered){
      if(isC&&on)cl+=' good';else if(isC)cl+=' good miss';else if(on)cl+=' wrong';
    }else if(on)cl+=' sel';
    var vi=(store.tr||answered)&&o.vi?'<span class="vi">'+esc(o.vi)+'</span>':'';
    var note=answered&&o.note?'<span class="note">'+esc(o.note)+'</span>':'';
    var tag=answered?(isC?(on?'':' (đáp án đúng, bạn bỏ sót)'):(on?' (chưa đúng)':'')):'';
    h+='<li><button class="'+cl+'" data-l="'+o.l+'"'+(answered?' disabled':'')+' aria-pressed="'+(on?'true':'false')+'"><span class="let">'+o.l+'</span><span><span class="en">'+esc(o.en)+'</span>'+(tag?'<span class="vi">'+tag+'</span>':'')+vi+note+'</span></button></li>';
  });
  h+='</ul>';
  if(!answered){
    h+='<div class="actions">'+(multi?'<button class="btn primary" id="chk"'+(chosen.length?'':' disabled')+'>Kiểm tra</button>':'')+'</div>';
  }else{
    var ok=store.ok[q.id];
    h+='<div class="verdict '+(ok?'ok':'bad')+'">'+(ok?'Chính xác.':'Chưa đúng. Đáp án: '+q.ans.split('').join(', '))+(q.ansnote?'<small>'+esc(q.ansnote)+'</small>':'')+'</div>';
    h+='<div class="actions"><button class="btn" id="redo">Làm lại câu này</button></div>';
    h+=secHtml('Giải thích',q.exp)+secHtml('Kiến thức RL',q.rl)+secHtml('Ví dụ',q.ex)+secHtml('Mẹo nhớ',q.tip,'tipbox');
  }
  c.innerHTML=h;
  $('jump').value=store.idx+1;$('jump').max=list.length;
}
function renderTop(){
  var sS=$('setSel');
  if(!sS.options.length){SETS.forEach(function(d){var o=document.createElement('option');o.value=d.id;o.textContent=d.label;sS.appendChild(o)})}
  sS.value=store.set;
  $('mStudy').setAttribute('aria-pressed',store.mode==='study');
  $('mWrong').setAttribute('aria-pressed',store.mode==='wrong');
  $('trBtn').textContent='Dịch: '+(store.tr?'bật':'tắt');$('trBtn').setAttribute('aria-pressed',store.tr);
  $('prev').disabled=store.idx<=0;$('next').disabled=store.idx>=list.length-1;
}
function render(){renderTop();renderStats();renderGrid();renderCard();save();
  var g=$('grid').querySelector('.cur');if(g&&g.scrollIntoView)try{g.scrollIntoView({block:'nearest'})}catch(e){}
}
function go(i,noScroll){
  if(!list.length)return;
  store.idx=Math.max(0,Math.min(list.length-1,i));sel={};render();
  if(!noScroll)window.scrollTo({top:0,behavior:'auto'});
}
function submit(){
  var q=cur();if(!q)return;
  var chosen=Object.keys(sel).filter(function(k){return sel[k]}).sort().join('');
  if(!chosen)return;
  store.ans[q.id]=chosen;store.ok[q.id]=(chosen===q.ans.split('').sort().join(''));
  sel={};render();
}
function reload(){buildList();sel={};render()}
$('card').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var q=cur();if(!q)return;
  if(b.id==='chk'){submit();return}
  if(b.id==='redo'){delete store.ans[q.id];delete store.ok[q.id];sel={};render();return}
  if(b.dataset.l&&!(q.id in store.ans)){
    if(isMulti(q)){sel[b.dataset.l]=!sel[b.dataset.l]}
    else{sel={};sel[b.dataset.l]=true;submit();return}
    render();
  }
});
$('grid').addEventListener('click',function(e){var b=e.target.closest('button');if(b){go(+b.dataset.i);$('side').classList.remove('open')}});
$('prev').onclick=function(){go(store.idx-1)};
$('next').onclick=function(){go(store.idx+1)};
$('goBtn').onclick=function(){var v=parseInt($('jump').value,10);if(v)go(v-1)};
$('jump').addEventListener('keydown',function(e){if(e.key==='Enter'){e.stopPropagation();var v=parseInt(this.value,10);if(v)go(v-1)}});
$('rndBtn').onclick=function(){
  var left=[];list.forEach(function(q,i){if(!(q.id in store.ans))left.push(i)});
  if(!left.length){return}
  var after=left.filter(function(i){return i>store.idx});go(after.length?after[0]:left[0]);
};
$('setSel').onchange=function(){store.set=this.value;store.idx=0;reload()};
$('mStudy').onclick=function(){store.mode='study';store.idx=0;reload()};
$('mWrong').onclick=function(){store.mode='wrong';store.idx=0;reload()};
$('trBtn').onclick=function(){store.tr=!store.tr;render()};
$('listBtn').onclick=function(){$('side').classList.toggle('open')};
$('themeBtn').onclick=function(){
  var dark=rootEl.getAttribute('data-theme')==='dark'||(!rootEl.getAttribute('data-theme')&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  store.theme=dark?'light':'dark';applyTheme();save();
};
var armed=false;
$('resetBtn').onclick=function(){
  var b=this;
  if(!armed){armed=true;b.textContent='Bấm lần nữa để xóa';setTimeout(function(){armed=false;b.textContent='Xóa tiến độ của bộ này'},3000);return}
  armed=false;b.textContent='Xóa tiến độ của bộ này';
  Q.filter(setDef().f).forEach(function(q){delete store.ans[q.id];delete store.ok[q.id]});
  store.idx=0;reload();
};
document.addEventListener('keydown',function(e){
  var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA'||e.ctrlKey||e.metaKey||e.altKey)return;
  var q=cur();
  if(e.key==='ArrowLeft'){go(store.idx-1)}
  else if(e.key==='ArrowRight'){go(store.idx+1)}
  else if(e.key==='Enter'){if(!q)return;if(q.id in store.ans)go(store.idx+1);else if(isMulti(q))submit()}
  else if(/^[a-hA-H]$/.test(e.key)&&q&&!(q.id in store.ans)){
    var L=e.key.toUpperCase();if(!q.opts.some(function(o){return o.l===L}))return;
    if(isMulti(q)){sel[L]=!sel[L];render()}else{sel={};sel[L]=true;submit()}
  }
});
window.addEventListener('load',function(){if(window.katex)renderCard()});
applyTheme();buildList();render();
})();
</script>
